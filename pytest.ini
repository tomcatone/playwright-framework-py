[pytest]
# ---- 用例相互隔离 ----
# 每个 worker 是独立进程，配合 conftest 中「函数级」browser/context fixture，
# 保证用例之间不共享内存状态、不共享登录态
addopts =
    -n auto
    --dist loadscope
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --alluredir=allure-results
    --html=playwright-report/report.html
    --self-contained-html
    -v
# 注意：重跑(--reruns)不写死在默认配置里 —— 本地失败大概率是真 bug，直接暴露更利于排查。
# CI 环境网络/时序更不稳定，建议在 CI 命令里显式追加：
#   pytest --reruns 2 --reruns-delay 2 --only-rerun "AssertionError|TimeoutError|Error"

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    flaky: 已知偶发不稳定的用例，允许更高重跑次数
    smoke: 冒烟用例，CI 中优先跑、快速失败
    regression: 全量回归用例
    p0: 核心链路，必须保证通过
