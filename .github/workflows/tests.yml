name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 用官方 Playwright 镜像跑（而不是在裸机 ubuntu-latest 上临时装浏览器），
    # 保证浏览器版本/系统字体渲染和生成视觉回归基准图时完全一致，避免误报。
    # 版本号需要和 requirements.txt 里的 playwright==1.48.0 保持一致。
    container:
      image: mcr.microsoft.com/playwright/python:v1.48.0-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 冒烟用例(smoke)先跑，几秒内就能发现主流程被破坏，
      # 不用等几十分钟的全量回归跑完才知道构建是坏的。
      - name: Run smoke tests (fail fast)
        run: pytest -m smoke --reruns 1 --reruns-delay 1
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: Run full regression suite
        run: >
          pytest -m "not smoke"
          --reruns 2 --reruns-delay 2
          --only-rerun "AssertionError|TimeoutError|Error"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline --no-progress
          allure generate allure-results --clean -o allure-report

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            allure-report/
            test-results/
          retention-days: 14

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"msg_type":"text","content":{"text":"CI 测试失败：${{ github.repository }} @ ${{ github.ref_name }}，详情见 Actions 运行记录"}}' \
            || true
