[project]
name = "playwright-framework"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pytest==8.3.3",
    "pytest-playwright==0.5.2",
    "playwright==1.48.0",
    "pytest-rerunfailures==14.0",
    "pytest-xdist==3.6.1",
    "allure-pytest==2.13.5",
    "pytest-html==4.1.1",
    "httpx==0.27.2",
    "SQLAlchemy==2.0.32",
    "psycopg2-binary==2.9.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
]

# pytest 的运行配置统一放在 pytest.ini（pytest 读配置时若两者都存在，
# 只会生效其中一个，这里避免定义在两处造成歧义）。
